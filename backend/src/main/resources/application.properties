# CivicConnect Backend — Base Configuration
# Environment-specific values should be provided via:
# - application-local.properties (gitignored, for local dev)
# - Environment variables (for production)

# ── Server ──────────────────────────────────────────────────────────────────────
server.port=8080
server.servlet.context-path=/api

# ── Spring Data JPA / Hibernate ─────────────────────────────────────────────────
# Validate schema on startup; do not auto-create (Flyway manages schema)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Flyway ──────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# ── Actuator / Health ───────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.db.enabled=true

# ── Jackson ─────────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.adjust-dates-to-context-time-zone=false

# Attachment uploads are additionally checked in the service before they reach storage.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ── OpenAPI / Swagger (optional, for Phase E) ───────────────────────────────────
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html


